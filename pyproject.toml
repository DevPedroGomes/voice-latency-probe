[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-latency-probe"
version = "0.1.0"
description = "Measure the real voice-to-voice latency of a LiveKit voice agent from the caller's side, and break each turn into end of turn, agent and delivery."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pedro Gomes" }]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = ["livekit>=1.0", "livekit-api>=1.0", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11", "build>=1.2"]

[project.scripts]
voice-probe = "voice_latency_probe.cli:main"

[project.urls]
Repository = "https://github.com/DevPedroGomes/voice-latency-probe"
Issues = "https://github.com/DevPedroGomes/voice-latency-probe/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"voice_latency_probe" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: needs a LiveKit server at LIVEKIT_URL"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "BLE", "DTZ", "PT"]

[tool.mypy]
strict = true
files = ["src", "tests"]
